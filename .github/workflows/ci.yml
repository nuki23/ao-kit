name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        # Windows detecta diferencias de orden, de rutas ("\") y de finales de línea (el checkout
        # convierte a CRLF). Solo build y test: lint y formato no dependen del sistema.
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: pnpm lint
      - if: runner.os == 'Linux'
        run: pnpm format:check
      - run: pnpm build
      # pnpm build regenera el plugin desde agent/: si cambia algo, se editó a mano o no se regeneró.
      - if: runner.os == 'Linux'
        name: plugin al día con agent/
        run: git status --porcelain -- plugins .claude-plugin && test -z "$(git status --porcelain -- plugins .claude-plugin)"
      - if: runner.os == 'Linux'
        run: pnpm typecheck
      - run: pnpm test
      - run: node packages/cli/dist/index.js --version
