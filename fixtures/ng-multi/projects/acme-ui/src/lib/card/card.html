<section class="ui-card" [class.ui-card--elevated]="elevated()">
  @if (title()) {
    <header class="ui-card__header">
      <h3>{{ title() }}</h3>
    </header>
  }
  <div class="ui-card__body">
    <ng-content />
  </div>
  <footer class="ui-card__footer">
    <ng-content select="[uiCardFooter]" />
  </footer>
</section>
