<mat-card class="card">
  <mat-card-header *ngIf="titulo">
    <mat-card-title>{{ titulo }}</mat-card-title>
    <mat-card-subtitle *ngIf="subtitulo">{{ subtitulo }}</mat-card-subtitle>
    <button *ngIf="cerrable" mat-icon-button class="card__cerrar" aria-label="Cerrar" (click)="cerrar.emit()">
      <mat-icon>close</mat-icon>
    </button>
  </mat-card-header>
  <mat-card-content>
    <ng-content></ng-content>
  </mat-card-content>
  <mat-card-actions align="end">
    <ng-content select="[cardActions]"></ng-content>
  </mat-card-actions>
</mat-card>
