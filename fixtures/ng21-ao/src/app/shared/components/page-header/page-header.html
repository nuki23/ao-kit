<header class="mb-6 flex items-center justify-between gap-4 border-b border-gray-200 pb-4">
  <div class="flex items-center gap-3">
    @if (backLink(); as link) {
      <a [routerLink]="link" class="text-gray-500 hover:text-brand-600" aria-label="Volver">
        <lucide-icon [img]="ArrowLeft" class="size-5" />
      </a>
    }
    <div>
      <h1 class="text-2xl font-semibold text-gray-900">{{ title() }}</h1>
      @if (subtitle()) {
        <p class="text-sm text-gray-500">{{ subtitle() }}</p>
      }
    </div>
  </div>

  <div class="flex items-center gap-2">
    <ng-content />
    @if (actionLabel()) {
      <button nz-button nzType="primary" (click)="action.emit()">{{ actionLabel() }}</button>
    }
  </div>
</header>
