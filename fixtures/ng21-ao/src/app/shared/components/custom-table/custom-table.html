@if (isEmpty()) {
  <app-empty-state title="Sin resultados" [description]="emptyText()" />
} @else {
  <nz-table
    #tabla
    nzSize="middle"
    [nzData]="data()"
    [nzLoading]="loading()"
    [nzPageSize]="pageSize()"
    [nzFrontPagination]="!serverPaging()"
    [nzTotal]="serverPaging() ? total() : data().length"
    [nzPageIndex]="pageIndex()"
    (nzPageIndexChange)="pageChange.emit($event)"
  >
    <thead>
      <tr>
        @for (col of columns(); track col.key) {
          <th [nzWidth]="col.width ?? null">{{ col.header }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of tabla.data; track row.id) {
        <tr class="cursor-pointer hover:bg-brand-50" (click)="rowClick.emit(row)">
          @for (col of columns(); track col.key) {
            <td>{{ row[col.key] }}</td>
          }
        </tr>
      }
    </tbody>
  </nz-table>
}
