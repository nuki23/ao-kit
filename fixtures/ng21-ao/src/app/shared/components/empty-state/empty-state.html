<div class="flex flex-col items-center gap-3 rounded-card border border-dashed border-gray-300 bg-white p-10 text-center">
  <lucide-icon [img]="Inbox" class="size-10 text-gray-400" />
  <h2 class="text-lg font-medium text-gray-900">{{ title() }}</h2>
  @if (description()) {
    <p class="max-w-sm text-sm text-gray-500">{{ description() }}</p>
  }
  @if (actionLabel()) {
    <button nz-button nzType="default" (click)="action.emit()">{{ actionLabel() }}</button>
  }
</div>
