<app-page-header
  title="Proveedores"
  subtitle="Administra los proveedores registrados."
  actionLabel="Nuevo proveedor"
  (action)="crear()"
>
  <button nz-button nzType="text" type="button" (click)="ayuda()">Ayuda</button>
</app-page-header>

<div class="mb-4 max-w-sm">
  <input
    nz-input
    placeholder="Buscar por nombre"
    [value]="filtro()"
    (input)="buscar($any($event.target).value)"
  />
</div>

@if (proveedores.error()) {
  <app-empty-state
    title="No se pudo cargar la lista"
    description="Revisa tu conexión e intenta de nuevo."
    actionLabel="Reintentar"
    (action)="proveedores.reload()"
  />
} @else {
  <app-custom-table
    [columns]="columns"
    [data]="proveedores.value()?.items ?? []"
    [loading]="proveedores.isLoading()"
    [serverPaging]="true"
    [total]="proveedores.value()?.total ?? 0"
    [pageIndex]="pagina()"
    [pageSize]="tamano()"
    (pageChange)="pagina.set($event)"
    (rowClick)="ver($event)"
  />
}
